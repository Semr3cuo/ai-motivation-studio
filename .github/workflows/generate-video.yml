name: Generate motivation video

on:
  push:
    branches: [main]
    paths: ['.github/workflows/generate-video.yml']
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema do vídeo"
        required: true
        default: "Disciplina quando ninguém está olhando"
      duracao:
        description: "Duração mantida por compatibilidade"
        required: true
        default: "8"
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.2' }}
      OUTPUT_DIR: output
      THEME_INPUT: ${{ inputs.tema }}
      DURATION_INPUT: ${{ inputs.duracao }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Generate video
        run: |
          THEME="$THEME_INPUT"
          if [ -z "$THEME" ]; then THEME="Disciplina quando ninguém está olhando"; fi
          python -m app.main --tema "$THEME" --duracao "${DURATION_INPUT:-8}"
      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: motivation-video
          path: output/videos/*.mp4
          if-no-files-found: error
          retention-days: 7
