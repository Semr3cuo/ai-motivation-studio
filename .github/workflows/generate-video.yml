name: Generate motivation video

on:
  push:
    branches: [main]
    paths: ['.github/workflows/generate-video.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: motivation-free-pilot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install piper-tts==1.2.0 pillow
          mkdir -p voice output/videos
          BASE=https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium
          curl --fail --location --retry 2 "$BASE/pt_BR-faber-medium.onnx" -o voice/model.onnx
          curl --fail --location --retry 2 "$BASE/pt_BR-faber-medium.onnx.json" -o voice/model.onnx.json
      - name: Render free neural pilot
        run: |
          python - <<'PY'
          import subprocess as sp
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import math, wave, textwrap, json, urllib.request, urllib.parse, html, re, array, sys
          out=Path('output/videos')
          phrases=[
            'Ninguém precisa aplaudir o seu esforço.',
            'A disciplina começa quando a vontade acaba.',
            'Nos dias difíceis, dê apenas mais um passo.',
            'Cada pequena vitória fortalece a sua mente.',
            'Não espere o momento perfeito. Comece hoje.',
            'Domine sua mente. Transforme sua vida.'
          ]
          def run(args, **kw):
              sp.run(args, check=True, **kw)
          def stamp(s):
              ms=round(s*1000)
              return f'{ms//3600000:02}:{ms//60000%60:02}:{ms//1000%60:02},{ms%1000:03}'
          # Only use Commons footage with explicit reusable licensing.
          credits=[]
          used=set()
          def footage(query, i):
              for term in (query, 'running athlete', 'running', 'jogging', 'hiking'):
                  result=search_footage(term,i)
                  if result is not None: return result
              raise RuntimeError('No eligible footage found: '+query)
          def search_footage(query, i):
              params={'action':'query','generator':'search','gsrsearch':query+' filetype:video','gsrnamespace':6,'gsrlimit':50,'prop':'imageinfo','iiprop':'url|size|mime|extmetadata','format':'json'}
              req=urllib.request.Request('https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params),headers={'User-Agent':'MenteInabalavelStudio/1.0 (https://github.com/Semr3cuo/ai-motivation-studio)'})
              with urllib.request.urlopen(req,timeout=45) as f:
                  pages=json.load(f).get('query',{}).get('pages',{})
              def rank(p):
                  info=p.get('imageinfo',[{}])[0]
                  w,h=info.get('width',0),info.get('height',0)
                  title=p.get('title','').lower()
                  return (sum(t in title for t in query.lower().split()), min(w*9/16,h), -p.get('index',999))
              for p in sorted(pages.values(),key=rank,reverse=True):
                  info=p.get('imageinfo',[{}])[0]
                  meta=info.get('extmetadata',{})
                  def val(k):
                      return html.unescape(re.sub('<[^>]+>','',meta.get(k,{}).get('value','')))
                  license=val('LicenseShortName')
                  if license not in ('CC0','Public domain','CC BY 4.0','CC BY 3.0','CC BY 2.0') or val('Restrictions').strip().lower() not in ('','none') or not info.get('mime','').startswith('video/') or not 100000<info.get('size',0)<100000000 or min(info.get('width',0)*16/9,info.get('height',0))<720 or p['title'] in used:
                      continue
                  description=(p['title']+' '+val('ImageDescription')).lower()
                  if not any(word in description for word in ('running','runner','jogging','athlete','athletics','marathon','hiking','hiker','training','sprint','trail')) or any(word in description for word in ('animation','animated','simulation','diagram','treadmill test','video game','cartoon')):
                      continue
                  dest=out/f'footage{i}.video'
                  try:
                      req=urllib.request.Request(info['url'],headers={'User-Agent':'MenteInabalavelStudio/1.0 (https://github.com/Semr3cuo/ai-motivation-studio)'})
                      with urllib.request.urlopen(req,timeout=90) as f, dest.open('wb') as target:
                          import shutil
                          shutil.copyfileobj(f,target)
                      run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height','-of','csv=p=0',str(dest)])
                  except Exception:
                      dest.unlink(missing_ok=True)
                      continue
                  used.add(p['title'])
                  credits.append({'scene':i+1,'title':p['title'],'author':val('Artist'),'license':license,'license_url':val('LicenseUrl'),'source':info.get('descriptionurl'),'changes':'vertical crop, color grading, fades, captions'})
                  return dest
              return None
          queries=['runner training outdoors','running athlete road','trail running uphill','runner endurance training','jogging sunrise','trail runner mountain']
          elapsed=0
          captions=[]
          clips=[]
          for i, phrase in enumerate(phrases):
              wav=out/f'voice{i}.wav'
              run(['piper','--model','voice/model.onnx','--output_file',str(wav),'--length_scale','1.08'],input=phrase+'\n',text=True)
              with wave.open(str(wav)) as w:
                  duration=w.getnframes()/w.getframerate()
              frames=math.ceil((duration+0.18)*30)
              length=frames/30
              captions.append(f'{i+1}\n{stamp(elapsed)} --> {stamp(elapsed+duration)}\n{phrase}\n')
              elapsed+=length
              bg=footage(queries[i],i)
              sub=out/f'scene{i}.srt'
              sub.write_text(f'1\n00:00:00,000 --> {stamp(duration)}\n'+ '\n'.join(textwrap.wrap(phrase,25))+'\n',encoding='utf-8')
              clip=out/f'clip{i}.mp4'
              vf=f"scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30,eq=contrast=1.08:saturation=0.88:brightness=-0.025,fade=t=in:d=0.12,fade=t=out:st={max(0,length-0.12)}:d=0.12,subtitles={sub}:force_style='FontName=DejaVu Sans,FontSize=15,Bold=1,Outline=1.5,Shadow=1,Alignment=2,MarginV=105'"
              run(['ffmpeg','-v','error','-y','-stream_loop','-1','-i',str(bg),'-i',str(wav),'-map','0:v:0','-map','1:a:0','-vf',vf,'-af','apad','-t',str(length),'-c:v','libx264','-preset','veryfast','-crf','17','-pix_fmt','yuv420p','-c:a','aac','-ar','48000','-ac','1',str(clip)])
              clips.append(clip)
          listing=out/'concat.txt'
          listing.write_text(''.join(f"file '{p.name}'\n" for p in clips))
          final=out/'mente-inabalavel.mp4'
          joined=out/'joined.mp4'
          run(['ffmpeg','-v','error','-y','-f','concat','-safe','0','-i',str(listing),'-c','copy','-movflags','+faststart',str(joined)])
          # Original synthesized instrumental bed, no third-party music.
          music=out/'music.wav'
          rate=24000
          samples=array.array('h')
          chords=[(110,130.81,164.81),(87.31,110,130.81),(65.41,82.41,98),(98,123.47,146.83)]
          for n in range(int(elapsed*rate)):
              t=n/rate
              chord=chords[int(t/4)%4]
              env=min(1,t/1.2,max(0,(elapsed-t)/1.2))
              v=sum(math.sin(2*math.pi*f*t)+0.15*math.sin(4*math.pi*f*t) for f in chord)/3
              samples.append(int(1500*env*v*(0.8+0.2*math.sin(2*math.pi*0.25*t))))
          if sys.byteorder!='little': samples.byteswap()
          with wave.open(str(music),'wb') as w:
              w.setparams((1,2,rate,0,'NONE','not compressed'))
              w.writeframes(samples.tobytes())
          run(['ffmpeg','-v','error','-y','-i',str(joined),'-i',str(music),'-filter_complex','[0:a]volume=1[v];[1:a]volume=0.55[m];[v][m]amix=inputs=2:duration=first:normalize=0,alimiter=limit=0.95[a]','-map','0:v','-map','[a]','-c:v','copy','-c:a','aac','-movflags','+faststart',str(final)])
          (out/'credits.json').write_text(json.dumps(credits,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'mente-inabalavel.srt').write_text('\n'.join(captions),encoding='utf-8')
          run(['ffprobe','-v','error','-show_streams','-show_format',str(final)])
          PY
      - name: Upload pilot
        id: review_artifact
        uses: actions/upload-artifact@v4
        with:
          name: motivation-video
          path: |
            output/videos/mente-inabalavel.mp4
            output/videos/mente-inabalavel.srt
            output/videos/credits.json
          if-no-files-found: error
          retention-days: 7
      - name: Request review before YouTube upload
        env:
          ARTIFACT_URL: ${{ steps.review_artifact.outputs.artifact-url }}
        run: |
          video_sha256=$(sha256sum output/videos/mente-inabalavel.mp4 | cut -d ' ' -f 1)
          {
            echo '## Vídeo aguardando sua análise'
            echo
            echo "1. Baixe o [vídeo, as legendas e os créditos]($ARTIFACT_URL)."
            echo '2. Assista ao MP4 e revise a narração, as legendas e os créditos.'
            echo "3. Se aprovar, abra [Upload private YouTube video]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/upload-youtube.yml), selecione main e preencha os campos abaixo."
            echo
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- video_sha256: $video_sha256"
            echo '- approved: marque somente após revisar e autorizar o envio privado.'
          } >> "$GITHUB_STEP_SUMMARY"
