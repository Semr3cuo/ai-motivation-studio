name: Upload private YouTube video

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run ID of the approved Generate motivation video artifact
        required: true
        type: string
      video_sha256:
        description: SHA-256 do MP4 exibido no resumo da geração
        required: true
        type: string
      approved:
        description: Revisei este vídeo e autorizo o envio privado ao canal
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: youtube-private-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main' && inputs.approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify trusted generator run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" |
            jq -e --arg repo "$GITHUB_REPOSITORY" '
              .path == ".github/workflows/generate-video.yml" and
              .conclusion == "success" and .head_branch == "main" and
              .head_repository.full_name == $repo and
              (.event == "push" or .event == "workflow_dispatch" or .event == "schedule")'
      - uses: actions/download-artifact@v4
        with:
          name: motivation-video
          path: upload-input
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Check the approved MP4
        env:
          APPROVED_SHA256: ${{ inputs.video_sha256 }}
        run: |
          [[ "$APPROVED_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          printf '%s  %s\n' "${APPROVED_SHA256,,}" upload-input/mente-inabalavel.mp4 | sha256sum --check --status
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.32.5
      - name: Upload and verify private video
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m app.youtube_upload upload-input
