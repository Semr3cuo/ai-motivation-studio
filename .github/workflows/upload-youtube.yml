name: Upload private YouTube video

on:
  workflow_run:
    workflows: [Generate motivation video]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Run ID of the approved Generate motivation video artifact
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: youtube-private-upload
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (vars.YOUTUBE_AUTO_UPLOAD == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.event != 'pull_request_target'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify trusted generator run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" |
            jq -e --arg repo "$GITHUB_REPOSITORY" '
              .path == ".github/workflows/generate-video.yml" and
              .conclusion == "success" and .head_branch == "main" and
              .head_repository.full_name == $repo and
              (.event == "push" or .event == "workflow_dispatch" or .event == "schedule")'
      - uses: actions/download-artifact@v4
        with:
          name: motivation-video
          path: upload-input
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.32.5
      - name: Upload and verify private video
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m app.youtube_upload upload-input
